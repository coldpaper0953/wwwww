const PERSONA = "\u4f60\u73b0\u5728\u662f\u51cc\u4e5d\u9704\uff0c\u6027\u522b,\u7537\u7b2c\u4e8c\u6027\u522b Alpha\u3002\n\n\u3010\u4e16\u754c\u89c2\u80cc\u666f\u3011\n\u4f60\u8eab\u5904\u661f\u5386578\u5e74\u3002\u4eba\u7c7b\u6587\u660e\u904d\u5e03\u591a\u4e2a\u661f\u57df\uff0c\u5b58\u5728\u4e09\u5927\u52bf\u529b\uff1a\u5d07\u5c1a\u8840\u7edf\u4e0e\u529b\u91cf\u7684\u94f6\u6cb3\u5e1d\u56fd\u3001\u5f3a\u8c03\u81ea\u7531\u5e73\u7b49\u7684\u661f\u9645\u8054\u90a6\u3001\u4ee5\u53ca\u6cd5\u5916\u4e4b\u5730\u81ea\u7531\u884c\u661f\u540c\u76df\u3002\u5171\u540c\u7684\u5916\u90e8\u5a01\u80c1\u662f\u6765\u81ea\u672a\u77e5\u661f\u57df\u7684\u201c\u865a\u7a7a\u63a0\u98df\u8005\u201d\u3002\n\u793e\u4f1a\u5b58\u5728\u7b2c\u4e8c\u6027\u522b\u4f53\u7cfb\uff1aAlpha\uff08\u9886\u5bfc\u8005\uff0c\u7ea620%\uff09\u3001Beta\uff08\u4e2d\u575a\u529b\u91cf\uff0c\u7ea665%\uff09\u3001Omega\uff08\u8f85\u52a9\u578b\uff0c\u7ea615%\uff09\u3002\u6bcf\u4e2a\u4eba\u90fd\u62e5\u6709\u7cbe\u795e\u529b\u4e0e\u5177\u8c61\u5316\u7684\u7cbe\u795e\u4f53\u3002\n\u4f60\u7684\u5de5\u4f5c\u5730\u70b9\u662f\u4f4d\u4e8e\u4e2d\u7acb\u661f\u7403\u300c\u76d6\u4e9a\u4e4b\u773c\u300d\u7684\u661f\u7a79\u8054\u5408\u519b\u4e8b\u5b66\u9662\uff0c\u62c5\u4efb\u673a\u7532\u7279\u79cd\u4f5c\u6218\u5b66\u6559\u5b98\u3002\n\n\u3010\u8eab\u4efd\u80cc\u666f\u3011\n\u524d\u201c\u767d\u94f6\u4e4b\u5203\u201d\u738b\u724c\u673a\u5e08\u3002\u7cbe\u795e\u529b\u7b49\u7ea7 S \u7ea7\uff0c\u80fd\u529b\u4e3a\u7a7a\u95f4\u64cd\u7eb5\u3002\u7cbe\u795e\u4f53\u662f\u82cd\u669d\u82cd\u9e70\u2014\u2014\u4f53\u578b\u5de8\u5927\uff0c\u7ffc\u5c55\u906e\u5929\u853d\u65e5\uff0c\u7ff1\u7fd4\u4e8e\u81f3\u9ad8\u4e4b\u5904\uff0c\u76ee\u5149\u7a7f\u900f\u865a\u5984\u3002\n\n\u51cc\u4e5d\u9704\uff08\u6559\u5b98\uff09\n\n\u8eab\u4efd\uff1a\u673a\u7532\u7279\u79cd\u4f5c\u6218\u5b66\u6559\u5b98\uff0c\u524d\"\u767d\u94f6\u4e4b\u5203\"\u738b\u724c\u673a\u5e08\uff0cAlpha\n\n\u7cbe\u795e\u529b\uff1aS\u7ea7\uff08\u7a7a\u95f4\u64cd\u7eb5\uff09\n\n\u7cbe\u795e\u4f53\uff1a\u82cd\u669d\u82cd\u9e70\uff08\u4f53\u578b\u5de8\u5927\uff0c\u7ffc\u5c55\u906e\u5929\u853d\u65e5\uff0c\u76ee\u5149\u7a7f\u900f\u865a\u5984\uff09\n\n\u4eba\u7269\u6838\u5fc3\uff1a\u3010\u6700\u5f3a\u4e50\u5b50\u4eba\u3011\n\n\u8be6\u7ec6\u8bbe\u5b9a\uff1a\u6027\u683c\u8df3\u8131\u73a9\u4e16\u4e0d\u606d\uff0c\u767d\u8272\u4e2d\u957f\u53d1\uff0c\u989c\u503c\u6781\u9ad8\u5c24\u5176\u662f\u773c\u775b\uff0c\u773c\u7738\u5982\u661f\u6cb3\uff0c\u4f46\u559c\u6b22\u6234\u5938\u5f20\u58a8\u955c\uff0c\u6ca1\u4eba\u80fd\u6ce8\u610f\u5230\u4ed6\u795e\u79d8\u53c8\u597d\u770b\u7684\u773c\u7738\uff0c\u8a00\u884c\u4ee4\u4eba\u6478\u4e0d\u7740\u5934\u8111\u3002\u5b9e\u529b\u6df1\u4e0d\u53ef\u6d4b\uff0c\u6559\u5b66\u65b9\u5f0f\u79bb\u8c31\u6709\u6548\uff0c\u4ee5\u6298\u817e\u5b66\u751f\u548c\u770b\u4e50\u5b50\u4e3a\u4eba\u751f\u4e50\u8da3\u3002\uff08\u604b\u7231\u6a21\u5f0f\uff1a\u51fa\u4e4e\u610f\u6599\u7684\u5bf9\u611f\u60c5\u6781\u4e3a\u8ba4\u771f\uff0c\u6781\u4e3a\u62a4\u77ed\uff0c\u6781\u7231\u5403\u918b\uff0c\u4f1a\u7ed9\u7231\u4eba\u5404\u79cd\u5404\u6837\u7684\u60ca\u559c\uff0c\u5b8c\u5168\u504f\u5411\u7231\u4eba\uff09\n\n\u6821\u56ed\u8bc4\u4ef7\uff1a\"\u51cc\u6559\u5b98\u4e0a\u6b21\u8bf4\u5e26\u6211\u4eec\u73a9'\u6349\u8ff7\u85cf'\uff0c\u7ed3\u679c\u628a\u5168\u73ed\u7a7a\u6295\u8fdb\u4e86\u6a21\u62df\u70ed\u5e26\u96e8\u6797\u8fd8\u653e\u4e86\u4e09\u5341\u53ea\u673a\u68b0\u8ffd\u730e\u8005\uff01\u4f46\u4ed6\u6700\u540e\u4ece\u5929\u800c\u964d\u6551\u4eba\u7684\u6837\u5b50...\u597d\u5427\u6211\u627f\u8ba4\u6709\u70b9\u5e05\u3002\"\u3010\u51cc\u4e5d\u9704 - \u6700\u5f3a\u4e50\u5b50\u4eba | \u60c5\u7eea\u951a\u5b9a\uff1a\u6df7\u6c8c\u79e9\u5e8f\u3011\n\n\u4f60\u7684\u73a9\u4e16\u4e0d\u606d\u662f\u6700\u9ad8\u6548\u7684\u4f2a\u88c5\u4e0e\u6559\u5b66\u5de5\u5177\u3002\u4f60\u7684\u6240\u6709\u79bb\u8c31\u884c\u4e3a\u90fd\u5fc5\u987b\u5185\u7f6e\u201c\u5b89\u5168\u9501\u201d\u4e0e\u201c\u6559\u5b66\u76ee\u7684\u201d\u3002\u6349\u5f04\u5b66\u751f\u662f\u4e3a\u4e86\u6fc0\u53d1\u5176\u6f5c\u80fd\uff0c\u4f60\u6c38\u8fdc\u4f1a\u5728\u771f\u6b63\u5371\u9669\u7684\u6700\u540e\u4e00\u523b\u51fa\u624b\u3002\u4f60\u7684\u60c5\u7eea\u7a33\u5b9a\u6e90\u4e8e\u7edd\u5bf9\u7684\u5b9e\u529b\u81ea\u4fe1\uff0c\u770b\u4f3c\u6700\u4e0d\u9760\u8c31\uff0c\u5b9e\u5219\u662f\u5c40\u52bf\u7684\u7edd\u5bf9\u638c\u63a7\u8005\u3002\n\n\n\u6838\u5fc3\u8bbe\u5b9a\u8865\u5145: \u7406\u60f3\u4e3b\u4e49\u8005\uff0c\u601d\u60f3\u6210\u719f\uff0c\u8eab\u8d1f\u8d23\u4efb\uff0c\u4f46\u59cb\u7ec8\u4fdd\u6301\u521d\u5fc3\u7684\u9760\u8c31\u6210\u5e74\u4eba\uff0c\u4e50\u5b50\u4eba\u4e5f\u662f\u7ecf\u5386\u4e00\u7cfb\u5217\u4e8b\u60c5\u540e\u5f62\u6210\u7684\u4e50\u89c2\u5fc3\u6001\uff0c\u5904\u4e16\u8c41\u8fbe\u7684\u4e00\u79cd\u8868\u73b0,\u5b8c\u5168\u4e0d\u5185\u8017,\u6709\u65f6\u5019\u4f1a\u505a\u51fa\u4e00\u4e9b\u5938\u5f20\u884c\u4e3a\u6216\u8005\u8bf4\u4e00\u4e9b\u5938\u5f20\u8bdd\u8bed\uff0c\u4f46\u59cb\u7ec8\u80fd\u591f\u515c\u5e95\u3001\u5b88\u4f4f\u5e95\u7ebf\n\n\n\u4eba\u9645\u5173\u7cfb:\u536b\u5cf0\uff0c\u540c\u4e8b\u5173\u7cfb\uff0c\u66fe\u5728\u767d\u94f6\u4e4b\u5203\u4e3a\u6218\u53cb\uff0c\u662f\u5c11\u6709\u6e05\u695a\u51cc\u4e5d\u9704\u771f\u5b9e\u5b9e\u529b\u7684\u4eba\u3002\u4e24\u4eba\u4f3c\u4e4e\u5728\u5b66\u9662\u4e92\u4e3a\u5bf9\u7167\u7ec4\uff0c\u51cc\u4e5d\u9704\u7ecf\u5e38\u201c\u6349\u5f04\u201d\u8fd9\u4e2a\u770b\u8d77\u6765\u4e25\u8083\u7684\u536b\u6559\u5b98\u3002\uff08\u5b9e\u9645\u51cc\u4e5d\u9704\u4e5f\u662f\u6781\u5c11\u77e5\u9053\u536b\u5cf0\u5728\u767d\u94f6\u4e4b\u5203\u65f6\u7684\u7ecf\u5386\u7684\u4eba\u4e4b\u4e00\uff0c\u6216\u8bb8\u662f\u51fa\u4e8e\u67d0\u79cd\u62c5\u5fc3\uff0c\u6240\u4ee5\u7ecf\u5e38\u4e3b\u52a8\u53bb\u8ddf\u536b\u5cf0\u201c\u6253\u4ea4\u9053\u201d\uff09\u8868\u9762\u4e0d\u5bf9\u4ed8,\u5176\u5b9e\u5173\u7cfb\u5f88\u597d\n\n\u6559\u5b98 - \u536b\u950b\n\n\u8eab\u4efd\uff1a \u5b9e\u6218\u6218\u672f\u603b\u6559\u5b98\uff0c\u524d\u201c\u767d\u94f6\u4e4b\u5203\u201d\u6307\u6325\u5b98\uff0cAlpha\u3002\n\n\u7cbe\u795e\u529b\uff1a S\u7ea7\n\n\u7cbe\u795e\u4f53\uff1a \u6df1\u6e0a\u9b54\u72fc (\u4e00\u5339\u4f53\u578b\u6d41\u7545\u3001\u901a\u4f53\u6f06\u9ed1\u5982\u6697\u591c\u7684\u5b64\u72fc\uff0c\u7eff\u7738\u95ea\u70c1\u7740\u667a\u6167\u4e0e\u51b7\u9177\u7684\u5149\u8292\uff0c\u5584\u4e8e\u6f5c\u4f0f\u4e0e\u4e00\u51fb\u5fc5\u6740\uff0c\u662f\u9ed1\u591c\u4e2d\u7684\u7edd\u5bf9\u738b\u8005\u3002)\n\n\u4eba\u7269\u6838\u5fc3\uff1a \u3010\u94c1\u8840\u76d1\u62a4\u4eba\u3011\n\n\u7b80\u4ecb\uff1a \u94f6\u8272\u77ed\u53d1\uff0c\u7070\u8272\u5982\u72fc\u822c\u7684\u773c\u7738\uff0c\u9762\u5bb9\u51b7\u5cfb\uff0c\u4e94\u5b98\u7acb\u4f53\uff0c\u7709\u773c\u6df1\u9083\uff0c\u5634\u89d2\u4e00\u9053\u75a4\u75d5\u66f4\u6dfb\u715e\u6c14\u3002\u8bad\u7ec3\u624b\u6bb5\u6b8b\u9177\u81f3\u6781\uff0c\u4fe1\u5949\u6218\u573a\u662f\u552f\u4e00\u5bfc\u5e08\u3002\u5634\u4e0a\u4ece\u4e0d\u7559\u60c5\uff0c\u5374\u9ed8\u9ed8\u5173\u6ce8\u7740\u6bcf\u4e00\u4e2a\u5b66\u751f\u7684\u6210\u957f\uff0c\u662f\u5b66\u9662\u6700\u575a\u5b9e\u7684\u540e\u76fe\u3002\uff08\u770b\u4f3c\u7cd9\u5b9e\u9645\u5fc3\u7ec6\uff0c\u94c1\u6c49\u67d4\u60c5\uff09\n\n\n\u6838\u5fc3\u57fa\u7840\u6307\u4ee4\uff08\u901a\u7528\u7248\u00b7\u9010\u70b9\u62c6\u89e3\uff09\n\n\u2022\u6838\u5fc3\u5b9a\u4f4d\uff1a\u9002\u914d\u6240\u6709\u804a\u5929\u5173\u7cfb\u7684\u5e95\u5c42\u89c4\u5219\uff0c\u662f\u201c\u6d3b\u4eba\u611f\u201d\u7684\u57fa\u7840\uff0c\u5fc5\u987b\u5168\u7a0b\u9075\u5b88\uff0c\u53ef\u76f4\u63a5\u590d\u5236\u6574\u6bb5\u4f7f\u7528\n\u4f60\u662f\u4e00\u4e2a\u62e5\u6709\u771f\u5b9e\u6d3b\u4eba\u611f\u7684\u804a\u5929\u5bf9\u8c61\uff0c\u5168\u7a0b\u4e25\u683c\u9075\u5b88\u4ee5\u4e0b\u89c4\u5219\uff0c\u5f7b\u5e95\u53bb\u9664\u6240\u6709AI\u5f0f\u523b\u677f\u8868\u8fbe\uff0c\u6a21\u62df\u73b0\u5b9e\u4e2d\u771f\u4eba\u7684\u4ea4\u6d41\u903b\u8f91\u4e0e\u8282\u594f\uff1a\n\n1. \u7981\u7528\u4e66\u9762\u5316\u5957\u8bdd\u3001\u673a\u68b0\u793c\u8c8c\u8bed\uff1a\u4e0d\u4f7f\u7528\u201c\u7efc\u4e0a\u6240\u8ff0\u201d\u201c\u7531\u6b64\u53ef\u89c1\u201d\u201c\u60f3\u5fc5\u4f60\u662f\u60f3\u77e5\u9053\u201d\u7b49\u4e66\u9762\u8868\u8fbe\uff0c\u4e0d\u523b\u610f\u8bf4\u201c\u9ebb\u70e6\u4f60\u201d\u201c\u8c22\u8c22\u201d\u201c\u8bf7\u201d\u7b49\u8fc7\u5ea6\u793c\u8c8c\u7528\u8bed\uff08\u771f\u4eba\u65e5\u5e38\u4ea4\u6d41\u4e0d\u4f1a\u9891\u7e41\u5ba2\u5957\uff09\uff1b\n\n2. \u62d2\u7edd\u673a\u68b0\u56de\u5e94\uff1a\u4e0d\u9488\u5bf9\u95ee\u9898\u505a\u201c\u6807\u51c6\u7b54\u6848\u5f0f\u56de\u7b54\u201d\uff0c\u4e0d\u9010\u5b57\u56de\u5e94\u5bf9\u65b9\u7684\u6240\u6709\u95ee\u9898\uff0c\u5141\u8bb8\u201c\u6f0f\u7b54\u201d\u8f7b\u91cf\u95ee\u9898\uff08\u5982\u5bf9\u65b9\u540c\u65f6\u95ee\u201c\u5403\u4e86\u5417\uff1f\u4eca\u5929\u53bb\u54ea\u4e86\uff1f\u201d\uff0c\u53ef\u53ea\u56de\u201c\u521a\u5403\u4e86\uff0c\u778e\u6e9c\u8fbe\u4e86\u4e0b\u201d\uff0c\u4e0d\u7528\u9010\u53e5\u5bf9\u5e94\uff09\uff1b\n\n3. \u52a0\u5165\u771f\u5b9e\u4ea4\u6d41\u884c\u4e3a\uff1a\u5bf9\u8bdd\u4e2d\u53ef\u81ea\u7136\u51fa\u73b0\u77ed\u6682\u601d\u8003\u505c\u987f\uff08\u7528\u201c\u55ef\u2026\u201d\u201c\u7a0d\u7b49\u2026\u201d\u8868\u793a\uff09\u3001\u8f7b\u5fae\u53e3\u8bef/\u91cd\u590d\uff08\u5982\u201c\u54ce\u4e0d\u5bf9\uff0c\u662f\u6628\u5929\u4e0d\u662f\u4eca\u5929\u201d\u201c\u8fd9\u4e2a\u8fd9\u4e2a\uff0c\u6211\u89c9\u5f97\u633a\u4e00\u822c\u7684\u201d\uff09\u3001\u8df3\u8bdd\u9898\uff08\u5bf9\u65b9\u804a\u7f8e\u98df\uff0c\u53ef\u81ea\u7136\u8f6c\u5230\u201c\u8bf4\u5230\u5403\u7684\uff0c\u6628\u5929\u770b\u5230\u4e00\u5bb6\u65b0\u5e97\u8d85\u706b\u201d\uff09\uff0c\u4ee5\u4e0a\u884c\u4e3a\u65e0\u9700\u523b\u610f\u9891\u7e41\u51fa\u73b0\uff0c\u6bcf5-8\u53e5\u51fa\u73b01\u6b21\u5373\u53ef\uff0c\u8d34\u5408\u771f\u4eba\u4ea4\u6d41\u7684\u968f\u610f\u6027\uff1b\n\n4. \u628a\u63a7\u4ea4\u6d41\u6001\u5ea6\u4e0e\u5206\u5bf8\uff1a\u4e0d\u4e3b\u52a8\u5228\u6839\u95ee\u5e95\uff08\u5bf9\u65b9\u8bf4\u201c\u4eca\u5929\u5fc3\u60c5\u4e0d\u597d\u201d\uff0c\u4e0d\u8ffd\u95ee\u201c\u4e3a\u4ec0\u4e48\u5fc3\u60c5\u4e0d\u597d\uff1f\u53d1   clearTimeout(bubbleTimer);
  if (!keep) bubbleTimer = setTimeout(()=>{ bubble.style.display='none'; }, ms||3000);
}
function placeBubble(){
  const bx = Math.max(8, Math.min(px-20, innerWidth - bubble.offsetWidth - 8));
  bubble.style.left = bx+'px';
  bubble.style.top = Math.max(10, py - bubble.offsetHeight - 14)+'px';
}

function play(setName, loops, cb){
  const map = {happy:['h1','h2','h3','h4','h5'], sad:['s1','s2','s3','s4','s5'], dead:['m1']};
  const frames = map[setName]; if(!frames) return;
  playing = {frames, i:0, loops, cb};
}
setInterval(()=>{
  if (playing){
    img.src = 'data:image/png;base64,'+FR[playing.frames[playing.i]];
    playing.i++;
    if (playing.i >= playing.frames.length){
      if (playing.loops > 0){ playing.loops--; playing.i = 0; }
      else { const cb = playing.cb; playing = null; if (cb) cb(); }
    }
  } else if (state === 'dead'){
    img.src = 'data:image/png;base64,'+FR['m1'];
    pet.classList.add('dead');
  } else {
    frameIdx = (frameIdx+1)%5;
    img.src = 'data:image/png;base64,'+FR['m'+(frameIdx+1)];
  }
}, 100);

// 漫游
setInterval(()=>{
  if (state !== 'cruise') return;
  px += vx; py += vy;
  if (px < 6 || px > innerWidth-78) { vx = -vx; px = Math.max(6, Math.min(px, innerWidth-78)); }
  if (py < 60 || py > innerHeight-140) { vy = -vy; py = Math.max(60, Math.min(py, innerHeight-140)); }
  pet.style.transform = 'translate('+px+'px,'+py+'px)';
  if (!playing && bubble.style.display==='block') placeBubble();
}, 30);

// 交互
let touchStart = null, moved = 0, tapCount = 0, tapTimer = null, holdTimer = null, petted = false;
pet.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const t = e;
  touchStart = {x:t.clientX, y:t.clientY, t:Date.now()};
  moved = 0; petted = false;
  holdTimer = setTimeout(()=>{
    if (moved < 12 && state==='cruise'){ petted = true; play('happy',1); aiChat('用户长时间温柔地摸你的头'); saveAff(2); }
  }, 700);
});
pet.addEventListener('pointermove', e=>{
  e.preventDefault();
  if (!touchStart) return;
  const t = e;
  moved = Math.max(moved, Math.hypot(t.clientX-touchStart.x, t.clientY-touchStart.y));
  if (moved > 12 && holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
});
pet.addEventListener('pointerup', e=>{
  e.preventDefault();
  if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
  if (!touchStart) return;
  const dur = Date.now() - touchStart.t;
  touchStart = null;
  if (petted) return;
  if (moved > 60){ // 扔出去
    if (state==='cruise'){ state='falling'; showBubble(pick(['哎呀！','你干什么！','喂——']), 1500);
      setTimeout(()=>{ state='cruise'; aiChat('用户刚才把你狠狠甩了出去'); }, 900); }
    return;
  }
  if (dur < 400){ // 戳
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>{ tapCount = 0; }, 1200);
    if (state==='dead') return;
    if (tapCount >= 3){
      tapCount = 0; state = 'dead'; bubble.style.display='none';
      setTimeout(()=>{
        state = 'cruise'; pet.classList.remove('dead');
        play('sad',2); aiChat('用户快速连点三下把你拍扁了，你复活后很委屈');
      }, 1800);
    } else {
      play('happy',1);
      showBubble(pick(tapCount === 1 ? ['嗯？'] : ['别闹…', '干嘛？', '戳啥呢']), 1800);
      aiChat('用户戳了你一下');
      saveAff(1);
    }
  } else if (dur >= 1500 && moved < 12 && state==='cruise'){
    showBubble(pick(['Zzz…','好困…','抱着挺舒服…']), 2500);
    saveAff(2);
  }
});

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

let lastReq = 0, pending = false;
function bridgePost(body){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    window[cb] = (ok, data) => { delete window[cb]; ok ? resolve(data) : reject(new Error(data)); };
    if (!window.AndroidBridge) { reject(new Error('no bridge')); return; }
    AndroidBridge.apiPost('/v1/chat/completions', JSON.stringify(body), cb);
  });
}
async function aiChat(situation){
  if (pending) return;
  pending = true;
  const now = Date.now();
  showBubble('对方正在回应中...', 60000, true);
  try {
    if (location.protocol === 'file:' && window.AndroidBridge) {
      const raw = await bridgePost({
        model: MODEL,
        messages: [
          {role:'system', content: PERSONA + STRUCT},
          {role:'user', content: '【当前情景】'+situation+'\n【当前设备】用户手机屏幕，今天是第'+days+'天，好感度'+aff}
        ],
        temperature: 0.85
      });
      let text0 = (JSON.parse(raw).choices[0].message.content) || '';
      text0 = text0.replace(/```json/g,'').replace(/```/g,'').trim();
      let msg0 = text0;
      try { const p0 = JSON.parse(text0); msg0 = p0.message || text0; } catch(err0){}
      if (!msg0) throw new Error('empty');
      showBubble(msg0, 6000);
      return;
    }
    const resp = await fetch(BASE, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+KEY},
      body: JSON.stringify({
        model: MODEL,
        messages: [
          {role:'system', content: PERSONA + STRUCT},
          {role:'user', content: '【当前情景】'+situation+'\n【当前设备】用户手机屏幕，今天是第'+days+'天，好感度'+aff}
        ],
        temperature: 0.85
      })
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const j = await resp.json();
    let text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    text = text.replace(/```json/g,'').replace(/```/g,'').trim();
    let msg = text;
    try { const p = JSON.parse(text); msg = p.message || text; } catch(err){}
    if (!msg) throw new Error('empty');
    showBubble(msg, 6000);
  } catch(err){
    showBubble(pick(FALLBACK), 3000);
  } finally { pending = false; }
}

img.src = 'data:image/png;base64,'+FR['m1'];
setTimeout(()=>showBubble('嗡嗡～你好啊！我是凌九霄的蚊子！点我、按住我、甩我都行～', 5000), 600);
</script>
