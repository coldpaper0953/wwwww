plugins {
    id 'com.android.application'
}

android {
    namespace 'com.weng.weng'
    compileSdk 34

    defaultConfig {
        applicationId "com.weng.weng"
        minSdk 24
        targetSdk 34
        versionCode 42
        versionName "2.11.0"
    }

    // ---- 两个版本：classic = 原版嗡嗡嗡（保持不动）；pet2 = 桌宠2.0（独立包名，可共存） ----
    flavorDimensions "edition"
    productFlavors {
        classic {
            dimension "edition"
            applicationId "com.weng.weng"
        }
        pet2 {
            dimension "edition"
            applicationId "com.weng.weng.pet2"
            versionCode 1
            versionName "2.0.0"
        }
    }

    signingConfigs {
        weng {
            storeFile file('keystore.p12')
            storePassword 'wengweng123'
            keyAlias 'wengwengwu'
            keyPassword 'wengweng123'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.weng
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.weng
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
