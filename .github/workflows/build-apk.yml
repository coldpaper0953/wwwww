name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK（两个版本：原版 + 桌宠2.0）
        run: gradle assembleClassicDebug assemblePet2Debug --no-daemon

      - name: 上传 原版嗡嗡嗡 产物
        uses: actions/upload-artifact@v4
        with:
          name: 嗡嗡嗡手机版-APK
          path: app/build/outputs/apk/classic/debug/app-classic-debug.apk
          retention-days: 90

      - name: 上传 桌宠2.0 产物
        uses: actions/upload-artifact@v4
        with:
          name: 桌宠2.0-APK
          path: app/build/outputs/apk/pet2/debug/app-pet2-debug.apk
          retention-days: 90
